
<!DOCTYPE html>
<html lang="fr">

<head>
    <script src="../js/theme.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profil - E-Gorée</title>

    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/settings.css">
    <link rel="stylesheet" href="../css/navbar.css">

    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/theme.css">
</head>


<body>

    <!-- ================= TOP BAR ================= -->

    <div class="topbar">
        <h1>Profil</h1>
    </div>


    <div class="scroll-area">

        <!-- RETOUR -->

        <a class="back-link" href="settings.html">

            <svg width="16"
                 height="16"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">

                <line x1="19"
                      y1="12"
                      x2="5"
                      y2="12"/>

                <polyline points="12 19 5 12 12 5"/>

            </svg>

            Retour aux paramètres

        </a>


        <!-- ================= CARTE PROFIL ================= -->

        <div class="profile-card"
             style="margin-top:14px;">

            <div class="avatar"
                 id="profileAvatar">
                --
            </div>

            <div class="name"
                 id="profileName">
                Chargement...
            </div>

            <div class="mail"
                 id="profileEmail">
                Chargement...
            </div>

        </div>


        <!-- ================= INFORMATIONS ================= -->

        <div class="settings-group">

            <div class="glabel">
                Mes informations
            </div>


            <!-- NOM -->

            <div class="setting-row">

                <div class="l">

                    <svg width="20"
                         height="20"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>

                        <circle cx="12"
                                cy="7"
                                r="4"/>

                    </svg>

                    Nom complet

                </div>

                <input
                    type="text"
                    id="fullName"
                    class="profile-input"
                    placeholder="Nom complet"
                >

            </div>


            <!-- EMAIL -->

            <div class="setting-row">

                <div class="l">

                    <svg width="20"
                         height="20"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2">

                        <rect x="2"
                              y="4"
                              width="20"
                              height="16"
                              rx="2"/>

                        <path d="m22 7-10 5L2 7"/>

                    </svg>

                    Adresse e-mail

                </div>

                <span
                    class="pf-val"
                    id="emailValue">
                    Chargement...
                </span>

            </div>



            <!-- LANGUE -->

            <div class="setting-row">

                <div class="l">

                    🌍

                    Langue

                </div>

                <span class="pf-val">
                    Français
                </span>

            </div>


            <!-- BOUTON ENREGISTRER -->

            <button
                class="btn-logout"
                id="saveProfileBtn"
                style="margin-top:15px;">

                💾 Enregistrer les modifications

            </button>

        </div>

    </div>


    <!-- ================= NAVIGATION ================= -->

    <div id="navbar"></div>

    <script src="../js/navbar-loader.js"></script>

    <!-- Système de traduction -->
    <script src="../js/i18n.js"></script>

    <!-- ================= FIREBASE ================= -->

    <script type="module">

        import {
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        import {
            doc,
            getDoc,
            updateDoc
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        import {
            auth,
            db
        } from "../js/firebase.js";


        console.log("👤 Profile Firebase chargé");


        const nameInput =
            document.getElementById("fullName");
const emailValue =
            document.getElementById("emailValue");

        const profileName =
            document.getElementById("profileName");

        const profileEmail =
            document.getElementById("profileEmail");

        const profileAvatar =
            document.getElementById("profileAvatar");

        const saveBtn =
            document.getElementById("saveProfileBtn");


        let currentUser = null;


        /* ================= UTILISATEUR ================= */

        onAuthStateChanged(auth, async (user) => {

            if (!user) {

                window.location.href =
                    "login.html";

                return;
            }


            currentUser = user;


            try {

                const userRef =
                    doc(db, "users", user.uid);


                const userSnap =
                    await getDoc(userRef);


                if (!userSnap.exists()) {

                    console.log(
                        "⚠️ Profil Firestore introuvable"
                    );

                    return;
                }


                const data =
                    userSnap.data();


                console.log(
                    "👤 Profil récupéré :",
                    data
                );


                /* NOM */

                const name =
                    data.fullName ||
                    "Utilisateur";


                nameInput.value =
                    name;


                profileName.textContent =
                    name;


                /* EMAIL */

                const email =
                    data.email ||
                    user.email;


                emailValue.textContent =
                    email;


                profileEmail.textContent =
                    email;
/* AVATAR */

                const initials =
                    name
                        .split(" ")
                        .filter(word => word.length > 0)
                        .slice(0, 2)
                        .map(word =>
                            word.charAt(0)
                        )
                        .join("")
                        .toUpperCase();


                profileAvatar.textContent =
                    initials || "EG";


            } catch (error) {

                console.error(
                    "❌ Erreur récupération profil :",
                    error
                );

            }

        });


        /* ================= ENREGISTRER ================= */

        saveBtn.addEventListener(
            "click",
            async () => {

                if (!currentUser) {

                    alert(
                        "Utilisateur non connecté."
                    );

                    return;
                }


                const newName =
                    nameInput.value.trim();
if (!newName) {

                    alert(
                        "Veuillez saisir votre nom complet."
                    );

                    return;
                }
saveBtn.disabled = true;

                saveBtn.textContent =
                    "Enregistrement...";


                try {

                    const userRef =
                        doc(
                            db,
                            "users",
                            currentUser.uid
                        );


                    await updateDoc(
                        userRef,
                        {
                            fullName: newName
                        }
                    );


                    /* Mise à jour visuelle */

                    profileName.textContent =
                        newName;


                    const initials =
                        newName
                            .split(" ")
                            .filter(word =>
                                word.length > 0
                            )
                            .slice(0, 2)
                            .map(word =>
                                word.charAt(0)
                            )
                            .join("")
                            .toUpperCase();


                    profileAvatar.textContent =
                        initials || "EG";


                    alert(
                        "✅ Profil mis à jour avec succès."
                    );


                } catch (error) {

                    console.error(
                        "❌ Erreur mise à jour :",
                        error
                    );


                    alert(
                        "Impossible de mettre à jour le profil."
                    );

                }


                saveBtn.disabled = false;

                saveBtn.textContent =
                    "💾 Enregistrer les modifications";

            }
        );

    </script>

</body>

</html>
